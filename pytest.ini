[pytest]
# pytest配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 测试标记
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试

# 测试发现
norecursedirs = .git .github .venv venv __pycache__ backend/experiments backend/data

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 超时设置
timeout = 300

# 覆盖率配置
cov = .
cov-report = html:coverage_html --term-missing --xml:coverage.xml
cov-config = .coveragerc
