# Embodied Robot Brain - Dependency Update Workflow
# Automated dependency updates with testing

name: Dependency Update

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight
  workflow_dispatch:

jobs:
  # Check for dependency updates
  check-updates:
    name: Check Dependencies
    runs-on: ubuntu-latest
    outputs:
      has-updates: ${{ steps.check.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Check for updates
        id: check
        run: |
          # Check for outdated packages
          pip install -r requirements.txt
          pip list --outdated --format=json > outdated.json

          # Check if there are any updates
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "[]" ]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload outdated packages
        uses: actions/upload-artifact@v3
        if: steps.check.outputs.has-updates == 'true'
        with:
          name: outdated-packages
          path: outdated.json

  # Update dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has-updates == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Update requirements
        run: |
          # Update requirements.txt
          pip-compile --upgrade requirements.in -o requirements.txt

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/unit/ -v --cov=backend

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: update dependencies'
          body: |
            ## Dependency Updates

            This PR updates the project dependencies to their latest versions.

            ### Changes
            - Updated Python packages in requirements.txt

            ### Testing
            - [x] Unit tests pass
            - [x] No breaking changes detected

            Please review the changes and merge if everything looks good.
          branch: chore/update-dependencies
          delete-branch: true

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has-updates == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit

      - name: Run safety check
        run: safety check -r requirements.txt

      - name: Run bandit security linter
        run: bandit -r backend/ -ll -ii

      - name: Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-report
          path: |
            safety-report.json
            bandit-report.json

  # Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [update-dependencies, security-audit]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Dependency update workflow completed"
          # Add your notification commands here
          # Example: Send to Slack, Teams, etc.
