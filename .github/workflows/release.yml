# Embodied Robot Brain - Release Workflow
# Automated release process

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Build and test before release
  pre-release:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run full test suite
        run: |
          pytest tests/ \
            -v \
            --cov=backend \
            --cov-report=xml

      - name: Check code quality
        run: |
          pip install ruff black isort
          ruff check .
          black --check .
          isort --check-only --profile black .

  # Build Docker image for release
  build-release:
    name: Build Release Image
    runs-on: ubuntu-latest
    needs: pre-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            yourdockerhub/embodied-robot-brain:${{ steps.version.outputs.VERSION }}
            yourdockerhub/embodied-robot-brain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Image
            ```bash
            docker pull yourdockerhub/embodied-robot-brain:${{ github.ref_name }}
            ```

            ## Installation
            ```bash
            # Using Docker Compose
            git clone https://github.com/your-username/embodied-robot-brain.git
            cd embodied-robot-brain/deployment
            docker-compose up -d
            ```
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: create-release
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ github.ref_name }} to production..."
          # Add your deployment commands here
          # Example: kubectl set image deployment/backend backend=yourdockerhub/embodied-robot-brain:${{ github.ref_name }}

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Add your verification commands here

      - name: Notify team
        run: |
          echo "Release ${{ github.ref_name }} deployed to production"
          # Add your notification commands here

  # Update documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Update version in docs
        run: |
          echo "Updating documentation for version ${{ github.ref_name }}..."
          # Add your documentation update commands here

      - name: Deploy docs
        run: |
          echo "Deploying updated documentation..."
          # Add your documentation deployment commands here
